name: Ferrum CI

on:
  push:
    paths-ignore:
      - '.agents-memory/**'
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm test
      - name: Syntax check all modules
        run: find src scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Shell syntax check
        run: bash -n scripts/appium-android-smoke.sh
      - name: MCP surface smoke
        shell: bash
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node ./bin/ferrum.mjs mcp > /tmp/ferrum-mcp.jsonl
          grep -q 'ferrum_run_suite' /tmp/ferrum-mcp.jsonl
          grep -q 'ferrum_benchmark' /tmp/ferrum-mcp.jsonl
          grep -q 'ferrum_browser_matrix' /tmp/ferrum-mcp.jsonl
          grep -q 'ferrum_run_pack' /tmp/ferrum-mcp.jsonl
          grep -q 'ferrum_list_spaces' /tmp/ferrum-mcp.jsonl
          grep -q 'ferrum_github_wiki_probe' /tmp/ferrum-mcp.jsonl
          grep -q 'ferrum_github_wiki_bootstrap' /tmp/ferrum-mcp.jsonl
          grep -q 'ferrum_list_evidence' /tmp/ferrum-mcp.jsonl
          grep -q 'ferrum_read_evidence' /tmp/ferrum-mcp.jsonl
          grep -q 'ferrum_verify_evidence' /tmp/ferrum-mcp.jsonl
      - name: Independent MCP Inspector compatibility smoke
        run: npm run smoke:mcp-inspector
      - name: Evidence integrity CLI and MCP smoke
        shell: bash
        run: |
          rm -rf /tmp/ferrum-integrity
          node ./bin/ferrum.mjs test ./examples/process-app.json --artifacts /tmp/ferrum-integrity --compact > /tmp/ferrum-integrity-run.json
          EVIDENCE_ID="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/ferrum-integrity-run.json','utf8')); process.stdout.write(r.id)")"
          node ./bin/ferrum.mjs evidence verify "$EVIDENCE_ID" --artifacts /tmp/ferrum-integrity > /tmp/ferrum-integrity-verify.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/ferrum-integrity-verify.json','utf8')); if(r.status!=='passed'||!r.manifestDescriptor?.digest?.startsWith('sha256:')) process.exit(1)"
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/ferrum-integrity-run.json','utf8')); console.log(JSON.stringify({jsonrpc:'2.0',id:3,method:'tools/call',params:{name:'ferrum_verify_evidence',arguments:{id:r.id,artifactsRoot:'/tmp/ferrum-integrity'}}}))" \
            | node ./bin/ferrum.mjs mcp > /tmp/ferrum-integrity-mcp.jsonl
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('/tmp/ferrum-integrity-mcp.jsonl','utf8').trim()); const v=JSON.parse(r.result.content[0].text); if(v.status!=='passed') process.exit(1)"

  chromium-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npm run smoke:web
      - name: Ferrum GitHub Wiki first-page browser smoke
        run: npm run smoke:github-wiki
      - name: Ferrum live ProjectDump Wiki probe
        if: runner.os == 'Linux'
        run: node ./bin/ferrum.mjs github-wiki probe Herbertofury/ProjectDump
      - name: Ferrum isolated cloned Space smoke
        shell: bash
        run: |
          node ./bin/ferrum.mjs spaces create ci-auth --spaces-root artifacts/ci-spaces
          node ./bin/ferrum.mjs test ./examples/self-test-web.json --headless --space ci-auth --space-mode clone --spaces-root artifacts/ci-spaces --compact
      - name: Install Brave and Opera GX for browser matrix
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install brave -y --no-progress
          choco install opera-gx -y --no-progress
      - name: Ferrum browser matrix
        if: runner.os == 'Linux'
        run: node ./bin/ferrum.mjs matrix ./examples/self-test-web.json --browsers chromium,chrome --workers 2 --headless --require-all --compact
      - name: Ferrum browser matrix
        if: runner.os == 'Windows'
        run: node ./bin/ferrum.mjs matrix ./examples/self-test-web.json --browsers chromium,chrome,edge,brave,opera-gx --workers 2 --headless --require-all --compact
      - run: npm run smoke:extension
      - name: Ferrum workload-pack extension smoke
        run: node ./bin/ferrum.mjs pack ./packs/ferrum-self-test.pack.json --headless --compact
      - run: npm run smoke:dashboard
      - name: Ferrum Electron real-app smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:electron
      - name: Ferrum Electron real-app smoke
        if: runner.os == 'Windows'
        run: npm run smoke:electron
      - name: Ferrum desktop shell smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:desktop
      - name: Ferrum desktop shell smoke
        if: runner.os == 'Windows'
        run: npm run smoke:desktop
      - name: Package Ferrum desktop shell
        run: npm run package:desktop
      - name: Fresh packaged Ferrum smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:packaged-desktop
      - name: Fresh packaged Ferrum smoke
        if: runner.os == 'Windows'
        run: npm run smoke:packaged-desktop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ferrum-evidence-${{ runner.os }}
          path: artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ferrum-desktop-${{ runner.os }}
          path: dist/
          if-no-files-found: error

  lightpanda-smoke:
    runs-on: ubuntu-latest
    env:
      LIGHTPANDA_VERSION: 0.3.7
      LIGHTPANDA_SHA256: 895339b02205171a181dde743ae0068bb4564884076feac8482baca9c212aa5a
      LIGHTPANDA_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Install verified Lightpanda release
        shell: bash
        run: |
          mkdir -p .ferrum/bin
          curl --fail --location --retry 3 \
            --output .ferrum/bin/lightpanda \
            "https://github.com/lightpanda-io/browser/releases/download/${LIGHTPANDA_VERSION}/lightpanda-x86_64-linux"
          echo "${LIGHTPANDA_SHA256}  .ferrum/bin/lightpanda" | sha256sum --check --strict
          chmod +x .ferrum/bin/lightpanda
          .ferrum/bin/lightpanda version
      - name: Ferrum Lightpanda fast-lane smoke
        env:
          FERRUM_LIGHTPANDA: ${{ github.workspace }}/.ferrum/bin/lightpanda
        run: npm run smoke:lightpanda
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ferrum-evidence-Lightpanda
          path: artifacts/
          if-no-files-found: ignore

  appium-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Install pinned Appium Android stack
        shell: bash
        run: |
          npm install --global appium@3.6.0 --no-audit --no-fund
          appium driver install uiautomator2@8.4.0
          appium --version
          appium driver list --installed
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ferrum real Android Settings smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash ./scripts/appium-android-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ferrum-evidence-Appium-Android
          path: artifacts/appium/
          if-no-files-found: error

name: Ferrum CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check src/cli.mjs
      - run: node --check src/runners/extension.mjs
      - run: node --check src/server/dashboard.mjs

  chromium-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npx playwright install chromium
      - run: npm run smoke:web
      - run: npm run smoke:extension
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ferrum-evidence-${{ runner.os }}
          path: artifacts/
          if-no-files-found: ignore

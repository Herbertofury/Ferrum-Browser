name: Ferrum evidence manifest performance

on:
  push:
    branches:
      - automation/perf-evidence-manifest-single-pass
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-manifest-benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - name: Syntax check benchmark
        run: node --check scripts/evidence-manifest-single-pass-benchmark.mjs
      - name: Benchmark single-pass evidence descriptors
        run: node scripts/evidence-manifest-single-pass-benchmark.mjs

  ferrum-unit-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: npm test

name: GameSync MCP v2 cross-repo recovery

# Additive full-fidelity recovery lane for the GameSync-Next MCP v2 Stack
# proposal while private-repository Actions execution is unavailable. This
# never mutates GameSync refs and fails closed without explicit read access.
on:
  push:
    branches:
      - automation/gamesync-infra-recovery-20260819-0450
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-sdk-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CROSS_REPO_TOKEN: ${{ secrets.FERRUM_GAMESYNC_READ_TOKEN || secrets.GH_PAT }}
      CANDIDATE_BRANCH: automation/stack-mcp-sdk-1-30
    steps:
      - name: Require private GameSync read token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CROSS_REPO_TOKEN:-}" ]]; then
            echo '::error::Set FERRUM_GAMESYNC_READ_TOKEN or GH_PAT with read access to Herbertofury/GameSync-Next.'
            exit 2
          fi

      - name: Check out current MCP v2 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Herbertofury/GameSync-Next
          ref: ${{ env.CANDIDATE_BRANCH }}
          fetch-depth: 0
          token: ${{ env.CROSS_REPO_TOKEN }}

      - name: Set up exact Node 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Capture exact candidate identity and reject stale main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD="$(git rev-parse HEAD)"
          printf 'SOURCE_HEAD=%s\n' "$SOURCE_HEAD" >> "$GITHUB_ENV"
          test "$(node --version)" = "v26.7.0"
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"

      - name: Regenerate authoritative MCP v2 lock graph
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const workspace = lock.packages?.['packages/mcp-local'];
          const client = lock.packages?.['node_modules/@modelcontextprotocol/client'];
          const server = lock.packages?.['node_modules/@modelcontextprotocol/server'];
          if (workspace?.dependencies?.['@modelcontextprotocol/client'] !== '^2.0.0') throw new Error('MCP workspace client lock declaration is not ^2.0.0');
          if (workspace?.dependencies?.['@modelcontextprotocol/server'] !== '^2.0.0') throw new Error('MCP workspace server lock declaration is not ^2.0.0');
          if (workspace?.dependencies?.['@modelcontextprotocol/sdk']) throw new Error('Legacy monolithic MCP SDK remains in workspace lock declaration');
          for (const [name, row] of [['client', client], ['server', server]]) {
            if (row?.version !== '2.0.0') throw new Error(`Expected MCP ${name} lock version 2.0.0, got ${row?.version}`);
            if (!row?.resolved?.endsWith(`/${name}-2.0.0.tgz`) || !row?.integrity) throw new Error(`MCP ${name} lock entry lacks immutable registry identity`);
          }
          NODE
          if grep -R --line-number --fixed-strings '@modelcontextprotocol/sdk' packages/mcp-local scripts/stack/mcp-local-runtime-smoke.mjs; then
            echo '::error::Legacy monolithic MCP SDK import remains in migrated local MCP surface.'
            exit 4
          fi
          git diff --check -- package-lock.json

      - name: Frozen install regenerated graph
        run: npm ci

      - name: Verify installed MCP v2 identities
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const name of ['client', 'server']) {
            const pkg = JSON.parse(fs.readFileSync(`node_modules/@modelcontextprotocol/${name}/package.json`, 'utf8'));
            if (pkg.version !== '2.0.0') throw new Error(`Expected installed MCP ${name} 2.0.0, got ${pkg.version}`);
          }
          NODE

      - name: Exercise real MCP v2 stdio runtime
        run: |
          node --check packages/mcp-local/server.mjs
          node --check scripts/stack/mcp-local-runtime-smoke.mjs
          node scripts/stack/mcp-local-runtime-smoke.mjs

      - name: Audit critical vulnerabilities
        run: npm audit --audit-level=critical

      - name: Build affected and consuming surfaces
        run: |
          npm run build:packages
          npm --workspace apps/server run build
          npm --workspace apps/desktop run build
          npm --workspace apps/extension-v2 run build
          npm run pw:list
          node --test scripts/audit-gamesync-parity.test.mjs

      - name: Recheck candidate identity and patch integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD
          git fetch origin "$CANDIDATE_BRANCH" --depth=1
          if [[ "$(git rev-parse FETCH_HEAD)" != "$SOURCE_HEAD" ]]; then
            echo '::error::MCP v2 candidate advanced during recovery; refusing stale evidence.'
            exit 3
          fi
          mkdir -p output/mcp-sdk
          cp package-lock.json output/mcp-sdk/package-lock.json
          git diff -- package-lock.json > output/mcp-sdk/package-lock.patch
          sha256sum package-lock.json > output/mcp-sdk/package-lock.sha256
          printf '%s\n' "$SOURCE_HEAD" > output/mcp-sdk/source-head.txt
          node --version > output/mcp-sdk/node-version.txt
          npm --version > output/mcp-sdk/npm-version.txt
          node --input-type=module <<'NODE' > output/mcp-sdk/mcp-package-versions.json
          import fs from 'node:fs';
          const out = {};
          for (const name of ['client', 'server']) out[name] = JSON.parse(fs.readFileSync(`node_modules/@modelcontextprotocol/${name}/package.json`, 'utf8')).version;
          console.log(JSON.stringify(out, null, 2));
          NODE

      - name: Upload MCP v2 recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gamesync-next-mcp-v2-recovery
          path: output/mcp-sdk
          if-no-files-found: warn

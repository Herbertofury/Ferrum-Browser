name: Recover durable STATUS to verified run 36

on:
  push:
    paths:
      - '.github/workflows/recover-run36-status.yml'

permissions:
  contents: write

jobs:
  recover-status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Repair run-36 checkpoint normalization and durable STATUS
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const testPath = 'tests/status-checkpoint.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const oldHeader = `  const verifiedProduct = entry?.verifiedProduct;\n  const proposal = entry?.proposal;\n  const directVerifiedWorkflowRun =\n    verifiedProduct?.mainWorkflowRun ?? verifiedProduct?.workflowRun ?? verifiedProduct?.latestFullGate ?? verifiedProduct?.ciRun ?? verifiedProduct?.proposalRun;`;
          const newHeader = `  const verifiedProduct = entry?.verifiedProduct;\n  const proposal = entry?.proposal;\n  const verification = entry?.verification;\n  const verificationWorkflowRun = Number(verification?.workflowRun ?? 0);\n  const verificationProof =\n    verifiedProduct?.commit &&\n    typeof verifiedProduct?.tree === 'string' && verifiedProduct.tree.length > 0 &&\n    typeof verifiedProduct?.testedProposalHead === 'string' && verifiedProduct.testedProposalHead.length > 0 &&\n    verifiedProduct?.treeParity === true &&\n    String(verification?.workflowConclusion ?? '').toLowerCase() === 'success' &&\n    Number.isSafeInteger(verificationWorkflowRun) &&\n    verificationWorkflowRun > 0;\n  const directVerifiedWorkflowRun =\n    verifiedProduct?.mainWorkflowRun ?? verifiedProduct?.workflowRun ?? verifiedProduct?.latestFullGate ?? verifiedProduct?.ciRun ?? verifiedProduct?.proposalRun ??\n    (verificationProof ? verificationWorkflowRun : undefined);`;
          if (!test.includes(oldHeader)) throw new Error('status normalizer header no longer matches expected base');
          test = test.replace(oldHeader, newHeader);

          const insertionAnchor = `  assert.deepEqual(\n    normalizeVerifiedCheckpoint({\n      checkedAt: '2026-08-18T17:25:18Z',\n      finalVerifiedProduct: {\n        commit: 'final-product',\n        tree: 'final-tree',\n        proposalHead: 'final-proposal',\n        workflow: 53,\n      },\n    }),\n    { commit: 'final-product', workflowRun: 53, verifiedAt: '2026-08-18T17:25:18Z' },\n  );\n`;
          const run36Tests = `${insertionAnchor}\n  assert.deepEqual(\n    normalizeVerifiedCheckpoint({\n      verifiedProduct: {\n        commit: 'run36-product',\n        tree: 'run36-tree',\n        testedProposalHead: 'run36-proposal',\n        treeParity: true,\n      },\n      verification: { workflowRun: 55, workflowConclusion: 'success' },\n    }),\n    { commit: 'run36-product', workflowRun: 55, verifiedAt: null },\n  );\n\n  assert.equal(\n    normalizeVerifiedCheckpoint({\n      verifiedProduct: {\n        commit: 'unproven-run36-product',\n        tree: 'run36-tree',\n        testedProposalHead: 'run36-proposal',\n        treeParity: true,\n      },\n      verification: { workflowRun: 56, workflowConclusion: 'failure' },\n    }),\n    null,\n  );\n`;
          if (!test.includes(insertionAnchor)) throw new Error('status normalizer test anchor no longer matches expected base');
          test = test.replace(insertionAnchor, run36Tests);
          fs.writeFileSync(testPath, test);

          const statusPath = '.agents-memory/STATUS.json';
          const status = JSON.parse(fs.readFileSync(statusPath, 'utf8'));
          status.verifiedCodeCommit = 'f9f7f7689c2711896cc7ac57dae29760b4f130cc';
          status.verifiedWorkflowRun = 32208809141;
          status.verifiedAt = '2026-08-19T02:35:00Z';
          const latest = status.verified.latestBuildArtifacts;
          latest.workflowRun = 32208809141;
          latest.codeCommit = 'f9f7f7689c2711896cc7ac57dae29760b4f130cc';
          latest.verifiedProposalHead = '70fc4920c31f8eae587edf2f6b9e3ec2435160b0';
          latest.verifiedTree = '6bff0ac4ad4272cd946fbc8d981b305d0b71f685';
          latest.treeMatchesMergedProduct = true;
          latest.tauriWebDriverWorkflowRun = 32194473469;
          latest.nativeWindowsWorkflowRun = 32199800977;
          latest.perfettoCompatibilityWorkflowRun = 32155315736;
          latest.linuxDesktop = { artifactId: 9350065653, sizeBytes: 145016162, providerSha256: 'dfc5f9fcdd95f8c9681747979d7c3d4211714275088d8deb6c72822c440a9c24', freshPackagedDesktopSmoke: 'passed', attestationId: 41511647, localProviderRedownloadDigestEqual: true, ghAttestationVerify: 'passed' };
          latest.windowsDesktop = { artifactId: 9350056674, sizeBytes: 166254073, providerSha256: 'f0bcba8bdbbab00e4c834d7d7723a06551bd463e6ea2681f66502c5908f561ed', freshPackagedDesktopSmoke: 'passed', attestationId: 41511597, localProviderRedownloadDigestEqual: true, ghAttestationVerify: 'passed' };
          latest.linuxEvidence = { artifactId: 9350064585, sizeBytes: 2258558, providerSha256: 'ef0e3a6d17f9f9fa6b317db168dac36b1352c26556c9dba0854ba6530ff24648' };
          latest.windowsEvidence = { artifactId: 9350055850, sizeBytes: 1922233, providerSha256: '7cbffcff61a56be0456406ca226d6bf0d2590b79534d1bef7f6edd4faeabfba6' };
          latest.appiumEvidence = { artifactId: 9350063840, sizeBytes: 124054, providerSha256: '5b7e151294a3bf0076f19a1a5cbe81316e133d4474bd64fe7556ba6d49fce111' };
          latest.webdriverGridEvidence = { artifactId: 9350034635, sizeBytes: 23377, providerSha256: 'c1efa59b6e00cdeb5a32ba3108df12d46950dee779b13820f5e98fb3ff5ba395' };
          latest.lightpandaEvidence = { artifactId: 9350015546, sizeBytes: 13072, providerSha256: 'ec767edc2e192cad2d0b19a7be710694f1a97453365c36ecd9f89cf6ef65d3c7' };
          latest.linuxProvenance = { artifactId: 9350071068, sizeBytes: 8345, providerSha256: '1084b28c79430a16adbcc2990711968d90a5348a048ffe534a73f0d1b98fbd41' };
          latest.windowsProvenance = { artifactId: 9350060690, sizeBytes: 8485, providerSha256: 'b9a7652e9b2af05fdecdbcd6636f5e0430128254a55fa0a3f2ab39240cf2dbdb' };
          latest.independentArtifactRedownloadHash = 'run-36 Linux/Windows producer SHA-256 equals provider digest, immutable artifact-ID redownload digest, and independently verified GitHub attestation; full severe CI passed and merged product tree equals exact tested proposal tree';

          const additions = [
            'real Tauri v2 application qualification through Ferrum WebDriver on Linux and Windows with real UI interaction and Rust IPC',
            'native Windows WPF/UIA qualification through both appium-desktop-driver and NovaWindows WebDriver providers',
            'parallel Brave and Opera GX Windows acceptance jobs while retaining Chromium/Chrome/Edge full-gate coverage',
            'producer-owned portable desktop tar transport with exact file-digest round-trip, runnable extracted-package proof, raw artifact upload and provider digest equality',
            'exact-byte GitHub artifact attestation with immutable artifact-ID redownload and independent gh attestation verify on Linux and Windows'
          ];
          for (const capability of additions) if (!status.verifiedCapabilities.includes(capability)) status.verifiedCapabilities.push(capability);
          const incident = 'Run-36 verifiedProduct checkpoint stores its successful workflow under sibling verification.workflowRun/workflowConclusion; STATUS normalization now recognizes that proof shape and durable STATUS is synchronized to product f9f7f7689c2711896cc7ac57dae29760b4f130cc / CI 32208809141 without dropping earlier evidence.';
          if (!status.incidentsResolved.includes(incident)) status.incidentsResolved.push(incident);
          fs.writeFileSync(statusPath, `${JSON.stringify(status, null, 2)}\n`);
          NODE
      - name: Verify exact recovery
        run: |
          node --test tests/status-checkpoint.test.mjs
          npm install --omit=dev --no-audit --no-fund
          npm test
          git diff --check
      - name: Commit repaired status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agents-memory/STATUS.json tests/status-checkpoint.test.mjs
          git commit -m 'Repair durable STATUS for evolution run 36'
          git push origin HEAD:automation/recover-run36-status

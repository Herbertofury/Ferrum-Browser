name: Run 38 npm lockfile experiment

on:
  push:
    branches:
      - evolution/run38-npm-lock-ci
    paths:
      - '.github/workflows/run38-generate-lock.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/run38-generate-lock.yml'

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: evolution/run38-npm-lock-ci
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Pin current npm for lock generation
        run: |
          npm install --global npm@11.17.0 --no-audit --no-fund
          test "$(npm --version)" = "11.17.0"
      - name: Generate deterministic dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Convert repository CI installs to frozen installs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'^(\s*-\s+run:\s+)npm install(?P<omit> --omit=dev)? --no-audit --no-fund\s*$', re.MULTILINE)
          changed = []
          replacements = 0
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              if path.name == 'run38-generate-lock.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(lambda m: f"{m.group(1)}npm ci{m.group('omit') or ''} --no-audit --no-fund", text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
                  replacements += count
          if replacements < 1:
              raise SystemExit('no repository npm install steps were converted')
          print(f'converted {replacements} repository install steps across {len(changed)} workflows')
          print('\n'.join(changed))
          PY
          if grep -R -n -E '^\s*-\s*run:\s*npm install( |$)' .github/workflows --include='*.yml' --exclude='run38-generate-lock.yml'; then
            echo 'unconverted repository npm install step remains' >&2
            exit 1
          fi
      - name: Validate lockfile and frozen clean install
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.lockfileVersion !== 3) throw new Error(`unexpected lockfileVersion ${lock.lockfileVersion}`);
          const root = lock.packages?.[''];
          if (!root) throw new Error('lockfile root package entry missing');
          for (const field of ['dependencies', 'devDependencies']) {
            const expected = pkg[field] || {};
            const actual = root[field] || {};
            if (JSON.stringify(expected) !== JSON.stringify(actual)) {
              throw new Error(`${field} does not match package.json`);
            }
          }
          NODE
          rm -rf node_modules
          npm ci --no-audit --no-fund
          npm test
          git diff --check
      - name: Stage validated experiment files
        shell: bash
        run: |
          rm -rf .ferrum/run38-generated
          mkdir -p .ferrum/run38-generated/.github/workflows
          cp package-lock.json .ferrum/run38-generated/package-lock.json
          for path in .github/workflows/api-stateful.yml .github/workflows/ci.yml .github/workflows/perfetto-trace.yml .github/workflows/service-fixture.yml .github/workflows/service-network-fault.yml; do
            cp "$path" ".ferrum/run38-generated/$path"
          done
          find .ferrum/run38-generated -type f -print0 | sort -z | xargs -0 sha256sum > .ferrum/run38-generated/SHA256SUMS
      - name: Upload validated experiment files
        uses: actions/upload-artifact@v7
        with:
          name: ferrum-run38-npm-lock-experiment
          path: .ferrum/run38-generated/
          if-no-files-found: error

name: Repair verified STATUS synchronization

on:
  push:
    branches:
      - automation/ferrum-bug-status-run39-20260819-0051
    paths:
      - '.github/workflows/status-sync-repair.yml'
      - 'scripts/sync-verified-status.mjs'
      - 'tests/status-sync.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/status-sync-repair.yml'
      - 'scripts/sync-verified-status.mjs'
      - 'tests/status-sync.test.mjs'

permissions:
  actions: read
  contents: write

jobs:
  synchronize-status:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact writable branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up exact Node 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install exact Ferrum dependencies
        run: npm ci --no-audit --no-fund

      - name: Promote newest fully verified evolution product into STATUS
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-verified-status.mjs

      - name: Validate STATUS identity and JSON
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const status = JSON.parse(fs.readFileSync('.agents-memory/STATUS.json', 'utf8'));
          if (status.state !== 'verified complete product checkpoint on main') throw new Error(`unexpected STATUS state: ${status.state}`);
          if (!status.verifiedCodeCommit || !status.verifiedWorkflowRun) throw new Error('STATUS verified product identity is incomplete');
          const productTree = execFileSync('git', ['rev-parse', `${status.verifiedCodeCommit}^{tree}`], { encoding: 'utf8' }).trim();
          if (productTree !== status.verified.latestBuildArtifacts.verifiedTree) throw new Error('STATUS product tree and latestBuildArtifacts tree disagree');
          execFileSync('git', ['merge-base', '--is-ancestor', status.verifiedCodeCommit, 'HEAD']);
          if (!status.statusSync || status.statusSync.product !== status.verifiedCodeCommit) throw new Error('STATUS synchronization provenance is missing');
          if ((status.blockers || []).length) throw new Error(`STATUS reports blocker(s): ${status.blockers.join(', ')}`);
          console.log(JSON.stringify({ product: status.verifiedCodeCommit, workflowRun: status.verifiedWorkflowRun, tree: productTree, source: status.statusSync.sourceEvolutionRecord }, null, 2));
          NODE

      - name: Run Ferrum unit and contract tests
        run: npm test

      - name: Check patch integrity
        run: git diff --check

      - name: Commit synchronized STATUS when changed
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .agents-memory/STATUS.json; then
            echo "STATUS is already synchronized."
            exit 0
          fi
          git config user.name "GameSync Lead Gate"
          git config user.email "actions@users.noreply.github.com"
          git add .agents-memory/STATUS.json
          git commit -m "Synchronize verified Ferrum STATUS"
          git push origin "HEAD:${BRANCH_NAME}"

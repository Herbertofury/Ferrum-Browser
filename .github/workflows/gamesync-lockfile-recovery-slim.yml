name: GameSync lockfile recovery on ubuntu-slim

# Additive recovery lane for authoritative npm lockfile regeneration while the
# standard hosted VM pool is not dispatching. This never mutates GameSync refs.
on:
  push:
    branches:
      - automation/gamesync-infra-recovery-20260819-0450
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regenerate:
    name: lockfile-${{ matrix.name }}
    runs-on: ubuntu-slim
    timeout-minutes: 14
    env:
      CROSS_REPO_TOKEN: ${{ secrets.FERRUM_GAMESYNC_READ_TOKEN || secrets.GH_PAT }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gamesync-idb-keyval
            repository: Herbertofury/Gamesync
            ref: 3bf322c09c2e4d5af9d3947739f40aa0e2ea4bc8
          - name: next-vite
            repository: Herbertofury/GameSync-Next
            ref: 03e77c36c8348a774013ac69524027f95f3f0944
          - name: next-test-toolchain
            repository: Herbertofury/GameSync-Next
            ref: 0a2e258317b0886a146198991d99d62b75a3b547
          - name: next-ui-runtime
            repository: Herbertofury/GameSync-Next
            ref: c4b212adaf5ac66711fb0fcfa787f61d845f9c43
          - name: next-typescript7
            repository: Herbertofury/GameSync-Next
            ref: 473ee7cac07e280b46775774338f75750fa7e5f3
          - name: next-desktop-runtime
            repository: Herbertofury/GameSync-Next
            ref: 311273d299418b52eb3f931f35d19e0952b1fa60
    steps:
      - name: Require private GameSync read token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CROSS_REPO_TOKEN:-}" ]]; then
            echo '::error::Set FERRUM_GAMESYNC_READ_TOKEN or GH_PAT with read access to both private GameSync repositories.'
            exit 2
          fi

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          token: ${{ env.CROSS_REPO_TOKEN }}

      - name: Set up exact Node 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate and verify authoritative lock graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.ref }}"
          test "$(node --version)" = "v26.7.0"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --check -- package-lock.json
          mkdir -p "output/${{ matrix.name }}"
          cp package-lock.json "output/${{ matrix.name }}/package-lock.json"
          git diff -- package-lock.json > "output/${{ matrix.name }}/package-lock.patch"
          sha256sum package-lock.json > "output/${{ matrix.name }}/package-lock.sha256"
          printf '%s\n' '${{ matrix.repository }}' > "output/${{ matrix.name }}/repository.txt"
          printf '%s\n' '${{ matrix.ref }}' > "output/${{ matrix.name }}/source-head.txt"
          node --version > "output/${{ matrix.name }}/node-version.txt"
          npm --version > "output/${{ matrix.name }}/npm-version.txt"

      - name: Upload regenerated lock graph
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repaired-lock-slim-${{ matrix.name }}
          path: output/${{ matrix.name }}
          if-no-files-found: warn

name: Fast-check lifecycle experiment

on:
  pull_request:

permissions:
  contents: read

jobs:
  lifecycle-model:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - name: Install Ferrum production dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Install isolated fast-check experiment dependency
        run: npm install --no-save --package-lock=false --omit=dev --ignore-scripts --no-audit --no-fund fast-check@4.9.0
      - name: Run bounded seeded lifecycle model
        run: node ./scripts/experiments/fast-check-lifecycle.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ferrum-fast-check-lifecycle-${{ runner.os }}
          path: .ferrum/experiments/
          if-no-files-found: error

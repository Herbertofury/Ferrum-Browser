name: Stack Playwright lock integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-lock:
    runs-on: ubuntu-slim
    steps:
      - name: Check out proposal branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Verify authoritative Playwright lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected='1.63.0-alpha-2026-08-19';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(p.dependencies?.playwright !== expected) throw new Error('Unexpected Playwright proposal version');
          if(lock.packages?.['']?.dependencies?.playwright !== expected) throw new Error('Root lock declaration differs from proposal');
          if(lock.packages?.['node_modules/playwright']?.version !== expected) throw new Error('Playwright lock resolution differs from proposal');
          if(lock.packages?.['node_modules/playwright-core']?.version !== expected) throw new Error('Playwright core lock resolution differs from proposal');
          NODE
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json package.json
          git diff --check

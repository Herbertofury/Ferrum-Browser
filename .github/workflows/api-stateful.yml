name: Ferrum stateful API benchmark

on:
  push:
    paths:
      - 'scripts/api-stateful-smoke.mjs'
      - 'src/runners/process.mjs'
      - 'src/core/**'
      - 'bin/**'
      - 'package.json'
      - '.github/workflows/api-stateful.yml'
  pull_request:
    paths:
      - 'scripts/api-stateful-smoke.mjs'
      - 'src/runners/process.mjs'
      - 'src/core/**'
      - 'bin/**'
      - 'package.json'
      - '.github/workflows/api-stateful.yml'

permissions:
  contents: read

jobs:
  stateful-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Ferrum fixed-seed stateful OpenAPI planted-defect benchmark
        run: |
          umask 000
          npm run smoke:api-stateful
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ferrum-evidence-Stateful-API
          path: artifacts/api-stateful/
          if-no-files-found: error

  gamesync-vite-crossrepo-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact Gamesync Vite proposal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Herbertofury/Gamesync
          ref: 8178577420ba9c540883c4dbac4634ed087f7788
          fetch-depth: 0
      - name: Set up Node 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
      - name: Prove exact candidate can execute outside blocked GameSync Actions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8178577420ba9c540883c4dbac4634ed087f7788"
          test "$(node --version)" = "v26.7.0"
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          npm ci
          npm audit --audit-level=critical
          npm run build
          npm run test:bounty
          git diff --check origin/main...HEAD

  gamesync-lock-repair:
    name: repair-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gamesync-idb-keyval
            repository: Herbertofury/Gamesync
            ref: 3bf322c09c2e4d5af9d3947739f40aa0e2ea4bc8
          - name: next-vite
            repository: Herbertofury/GameSync-Next
            ref: 03e77c36c8348a774013ac69524027f95f3f0944
          - name: next-test-toolchain
            repository: Herbertofury/GameSync-Next
            ref: 0a2e258317b0886a146198991d99d62b75a3b547
          - name: next-ui-runtime
            repository: Herbertofury/GameSync-Next
            ref: c4b212adaf5ac66711fb0fcfa787f61d845f9c43
          - name: next-typescript7
            repository: Herbertofury/GameSync-Next
            ref: 473ee7cac07e280b46775774338f75750fa7e5f3
          - name: next-desktop-runtime
            repository: Herbertofury/GameSync-Next
            ref: 311273d299418b52eb3f931f35d19e0952b1fa60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: Set up Node 26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: npm
      - name: Regenerate and validate authoritative npm lock graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.ref }}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --check -- package-lock.json
          mkdir -p output
          cp package-lock.json output/package-lock.json
          git diff -- package-lock.json > output/package-lock.patch
          sha256sum package-lock.json > output/package-lock.sha256
          printf '%s\n' '${{ matrix.repository }}' > output/repository.txt
          printf '%s\n' '${{ matrix.ref }}' > output/source-head.txt
          npm --version > output/npm-version.txt
      - name: Upload regenerated lock graph
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repaired-lock-${{ matrix.name }}
          path: output
          if-no-files-found: warn

name: GameSync upstream registry freshness probe

# Public, token-free upstream package freshness evidence for the coordinated
# GameSync Stack proposals. This does not replace private checkout, lockfile,
# Ferrum, Opera GX, Tauri, security, parity, or merge acceptance gates.
on:
  push:
    branches:
      - automation/gamesync-infra-recovery-20260819-0450
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-registry-freshness:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Resolve current npm dist-tags and immutable package identities
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const packages = [
            'vite','@vitejs/plugin-react','wxt','web-vitals','idb-keyval','playwright','@playwright/test','@playwright/browser-chromium','oxlint','ws','react','react-dom','@types/react','@types/react-dom','three','@types/three','@react-three/fiber','@react-three/drei','typescript','playcanvas','@tauri-apps/cli'
          ];

          const npmView = (args) => JSON.parse(execFileSync('npm', ['view', ...args, '--json'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] }));
          const report = { generatedAt: new Date().toISOString(), node: process.version, npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(), packages: {} };
          for (const name of packages) {
            const distTags = npmView([name, 'dist-tags']);
            const selected = {};
            for (const tag of ['latest','next','beta','rc','canary','alpha']) {
              const version = distTags?.[tag];
              if (!version) continue;
              const immutable = npmView([`${name}@${version}`,'version','dist.tarball','dist.integrity','engines','dependencies','optionalDependencies','peerDependencies']);
              selected[tag] = { version, resolvedVersion: immutable.version ?? version, tarball: immutable['dist.tarball'] ?? immutable.dist?.tarball ?? null, integrity: immutable['dist.integrity'] ?? immutable.dist?.integrity ?? null, engines: immutable.engines ?? null, dependencies: immutable.dependencies ?? null, optionalDependencies: immutable.optionalDependencies ?? null, peerDependencies: immutable.peerDependencies ?? null };
              if (!selected[tag].tarball || !selected[tag].integrity) throw new Error(`${name}@${version} did not expose immutable tarball/integrity metadata`);
            }
            report.packages[name] = { distTags, selected };
          }
          fs.writeFileSync('gamesync-upstream-registry.json', `${JSON.stringify(report, null, 2)}\n`, 'utf8');
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Summarize coordinated Stack targets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('gamesync-upstream-registry.json', 'utf8'));
          console.log('## GameSync upstream npm registry freshness'); console.log(''); console.log(`Generated: \`${r.generatedAt}\``); console.log(`Node: \`${r.node}\`; npm: \`${r.npm}\``); console.log(''); console.log('| package | latest | next/beta/rc/canary/alpha |'); console.log('|---|---:|---|');
          for (const [name,row] of Object.entries(r.packages)) { const d=row.distTags||{}; const forward=['next','beta','rc','canary','alpha'].filter(k=>d[k]).map(k=>`${k}: ${d[k]}`).join('<br>')||'-'; console.log(`| \`${name}\` | \`${d.latest||'-'}\` | ${forward} |`); }
          NODE
      - name: Upload registry freshness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gamesync-upstream-registry-freshness
          path: gamesync-upstream-registry.json
          if-no-files-found: error

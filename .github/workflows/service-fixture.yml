name: Ferrum service fixture

on:
  push:
    paths:
      - 'scripts/disposable-service-smoke.mjs'
      - 'src/runners/process.mjs'
      - 'src/core/**'
      - 'bin/**'
      - 'package.json'
      - '.github/workflows/service-fixture.yml'
  pull_request:
    paths:
      - 'scripts/disposable-service-smoke.mjs'
      - 'src/runners/process.mjs'
      - 'src/core/**'
      - 'bin/**'
      - 'package.json'
      - '.github/workflows/service-fixture.yml'

permissions:
  contents: read

jobs:
  disposable-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Ferrum disposable local/container service parity smoke
        run: npm run smoke:service-fixture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7
        if: always()
        with:
          name: ferrum-evidence-Service-Fixture
          path: artifacts/service-fixture/
          if-no-files-found: error

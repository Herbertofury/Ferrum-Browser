name: Ferrum service fixture

on:
  push:
    paths:
      - 'scripts/disposable-service-smoke.mjs'
      - 'src/runners/process.mjs'
      - 'src/core/**'
      - 'bin/**'
      - 'package.json'
      - '.github/workflows/service-fixture.yml'
  pull_request:
    paths:
      - 'scripts/disposable-service-smoke.mjs'
      - 'src/runners/process.mjs'
      - 'src/core/**'
      - 'bin/**'
      - 'package.json'
      - '.github/workflows/service-fixture.yml'

permissions:
  contents: read

jobs:
  disposable-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Ferrum disposable local/container service parity smoke
        run: npm run smoke:service-fixture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ferrum-evidence-Service-Fixture
          path: artifacts/service-fixture/
          if-no-files-found: error

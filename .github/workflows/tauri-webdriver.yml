name: Ferrum Tauri WebDriver

on:
  pull_request:
    paths:
      - '.github/workflows/tauri-webdriver.yml'
      - 'scripts/tauri-webdriver-smoke.mjs'
      - 'scripts/tauri-embedded-webdriver-smoke.mjs'
      - 'scripts/prepare-tauri-embedded-fixture.mjs'
      - 'src/runners/webdriver.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tauri-embedded:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tauri-apps/webdriver-example
          ref: e4c2607cd60287a0ceb69458a0d69d0b676f39a6
          path: .ferrum/tauri-fixture
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install Ferrum runtime dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libayatana-appindicator3-dev xvfb
      - name: Prepare pinned Tauri fixture for embedded W3C provider
        env:
          FERRUM_TAURI_EMBEDDED_PLUGIN_VERSION: 1.3.0
          FERRUM_TAURI_EMBEDDED_TAURI_VERSION: 2.11.5
          FERRUM_TAURI_EMBEDDED_TAURI_BUILD_VERSION: 2.6.3
        run: node scripts/prepare-tauri-embedded-fixture.mjs .ferrum/tauri-fixture/v2
      - name: Align embedded Tauri runtime family
        working-directory: .ferrum/tauri-fixture/v2/src-tauri
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p tauri-build --precise 2.6.3
          cargo update -p tauri --precise 2.11.5
          cargo update -p tauri-runtime --precise 2.11.3
          cargo update -p tauri-runtime-wry --precise 2.11.4
          cargo tree -i tauri-build
          cargo tree -i tauri-runtime
          cargo tree -i tauri-runtime-wry
      - name: Install pinned Tauri fixture dependencies
        working-directory: .ferrum/tauri-fixture/v2
        run: pnpm install --frozen-lockfile
      - name: Build pinned Tauri fixture with embedded W3C provider
        working-directory: .ferrum/tauri-fixture/v2
        run: pnpm tauri build --debug --no-bundle
      - name: Ferrum embedded Tauri application smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          FERRUM_TAURI_APP: ${{ github.workspace }}/.ferrum/tauri-fixture/v2/src-tauri/target/debug/tauri-app
          FERRUM_TAURI_ARTIFACTS: ${{ github.workspace }}/artifacts/tauri-embedded
          FERRUM_TAURI_FIXTURE_COMMIT: e4c2607cd60287a0ceb69458a0d69d0b676f39a6
          FERRUM_TAURI_EMBEDDED_PLUGIN_VERSION: 1.3.0
          FERRUM_TAURI_SERVER: http://127.0.0.1:4445
        run: xvfb-run -a npm run smoke:tauri-embedded
      - name: Ferrum embedded Tauri application smoke
        if: runner.os == 'Windows'
        shell: powershell
        env:
          FERRUM_TAURI_APP: ${{ github.workspace }}\.ferrum\tauri-fixture\v2\src-tauri\target\debug\tauri-app.exe
          FERRUM_TAURI_ARTIFACTS: ${{ github.workspace }}\artifacts\tauri-embedded
          FERRUM_TAURI_FIXTURE_COMMIT: e4c2607cd60287a0ceb69458a0d69d0b676f39a6
          FERRUM_TAURI_EMBEDDED_PLUGIN_VERSION: 1.3.0
          FERRUM_TAURI_SERVER: http://127.0.0.1:4445
        run: npm run smoke:tauri-embedded
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ferrum-evidence-Tauri-Embedded-${{ runner.os }}
          path: artifacts/tauri-embedded/
          if-no-files-found: error

  tauri-official-reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: tauri-apps/webdriver-example
          ref: e4c2607cd60287a0ceb69458a0d69d0b676f39a6
          path: .ferrum/tauri-fixture
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install Ferrum runtime dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libayatana-appindicator3-dev webkit2gtk-driver xvfb
          echo "FERRUM_TAURI_NATIVE_DRIVER_VERSION=$(WebKitWebDriver --version | head -n1)" >> "$GITHUB_ENV"
      - name: Install matching Edge WebDriver
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
          $nativeVersion = (& .\msedgedriver.exe --version | Out-String).Trim()
          "FERRUM_TAURI_NATIVE_DRIVER_VERSION=$nativeVersion" >> $env:GITHUB_ENV
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Install pinned Tauri fixture dependencies
        working-directory: .ferrum/tauri-fixture/v2
        run: pnpm install --frozen-lockfile
      - name: Build pinned Tauri fixture
        working-directory: .ferrum/tauri-fixture/v2
        run: pnpm tauri build --no-bundle
      - name: Ferrum real Tauri application smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          FERRUM_TAURI_APP: ${{ github.workspace }}/.ferrum/tauri-fixture/v2/src-tauri/target/release/tauri-app
          FERRUM_TAURI_ARTIFACTS: ${{ github.workspace }}/artifacts/tauri-official
          FERRUM_TAURI_FIXTURE_COMMIT: e4c2607cd60287a0ceb69458a0d69d0b676f39a6
          FERRUM_TAURI_DRIVER_VERSION: 2.0.6
        run: xvfb-run -a npm run smoke:tauri
      - name: Ferrum real Tauri application smoke (diagnostic reference)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        env:
          FERRUM_TAURI_APP: ${{ github.workspace }}\.ferrum\tauri-fixture\v2\src-tauri\target\release\tauri-app.exe
          FERRUM_TAURI_ARTIFACTS: ${{ github.workspace }}\artifacts\tauri-official
          FERRUM_TAURI_FIXTURE_COMMIT: e4c2607cd60287a0ceb69458a0d69d0b676f39a6
          FERRUM_TAURI_DRIVER_VERSION: 2.0.6
          FERRUM_TAURI_STARTUP_MS: 240000
        run: npm run smoke:tauri
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ferrum-evidence-Tauri-Official-${{ runner.os }}
          path: artifacts/tauri-official/
          if-no-files-found: error

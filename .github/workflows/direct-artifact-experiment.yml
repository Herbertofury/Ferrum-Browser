name: Direct desktop artifact experiment

on:
  pull_request:

permissions:
  contents: read

jobs:
  compare-desktop-transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Package Ferrum desktop shell
        run: npm run package:desktop
      - name: Local packaged Ferrum smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:packaged-desktop
      - name: Local packaged Ferrum smoke
        if: runner.os == 'Windows'
        run: npm run smoke:packaged-desktop
      - name: Record original package manifest and direct archive
        shell: bash
        run: |
          rm -rf .ferrum/transport
          mkdir -p .ferrum/transport
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > .ferrum/transport/original.sha256
          tar -C dist -cf - . | gzip -1 > ".ferrum/transport/proposal-ferrum-desktop-${RUNNER_OS}.tar.gz"
          node -e "const fs=require('fs'),c=require('crypto');const p='.ferrum/transport/proposal-ferrum-desktop-'+process.env.RUNNER_OS+'.tar.gz';const b=fs.readFileSync(p);console.log(JSON.stringify({path:p,bytes:b.length,sha256:c.createHash('sha256').update(b).digest('hex')}))"
      - name: Baseline upload-artifact directory compression
        id: baseline-upload
        uses: actions/upload-artifact@v7
        with:
          name: baseline-ferrum-desktop-${{ runner.os }}
          path: dist/
          if-no-files-found: error
          compression-level: 1
      - name: Proposal direct precompressed upload
        id: proposal-upload
        uses: actions/upload-artifact@v7
        with:
          path: .ferrum/transport/proposal-ferrum-desktop-${{ runner.os }}.tar.gz
          if-no-files-found: error
          archive: false
      - name: Download baseline artifact
        uses: actions/download-artifact@v8
        with:
          name: baseline-ferrum-desktop-${{ runner.os }}
          path: .ferrum/baseline
      - name: Download proposal artifact
        uses: actions/download-artifact@v8
        with:
          name: proposal-ferrum-desktop-${{ runner.os }}.tar.gz
          path: .ferrum/proposal
      - name: Verify baseline round-trip content
        shell: bash
        run: |
          rm -rf dist
          mv .ferrum/baseline dist
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > .ferrum/transport/baseline.sha256
          diff -u .ferrum/transport/original.sha256 .ferrum/transport/baseline.sha256
      - name: Baseline downloaded packaged Ferrum smoke
        id: baseline-linux-smoke
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a npm run smoke:packaged-desktop
      - name: Confirm baseline Linux permission loss
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "${{ steps.baseline-linux-smoke.outcome }}" = "failure"
          test ! -x dist/Ferrum-linux-x64/Ferrum
      - name: Baseline downloaded packaged Ferrum smoke
        if: runner.os == 'Windows'
        run: npm run smoke:packaged-desktop
      - name: Verify proposal round-trip content
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          tar -xzf ".ferrum/proposal/proposal-ferrum-desktop-${RUNNER_OS}.tar.gz" -C dist
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > .ferrum/transport/proposal.sha256
          diff -u .ferrum/transport/original.sha256 .ferrum/transport/proposal.sha256
      - name: Proposal downloaded packaged Ferrum smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:packaged-desktop
      - name: Proposal downloaded packaged Ferrum smoke
        if: runner.os == 'Windows'
        run: npm run smoke:packaged-desktop
      - name: Transport experiment summary
        shell: bash
        run: |
          node -e "console.log(JSON.stringify({baseline:{artifactId:process.env.BASELINE_ID,digest:process.env.BASELINE_DIGEST},proposal:{artifactId:process.env.PROPOSAL_ID,digest:process.env.PROPOSAL_DIGEST}},null,2))"
        env:
          BASELINE_ID: ${{ steps.baseline-upload.outputs.artifact-id }}
          BASELINE_DIGEST: ${{ steps.baseline-upload.outputs.artifact-digest }}
          PROPOSAL_ID: ${{ steps.proposal-upload.outputs.artifact-id }}
          PROPOSAL_DIGEST: ${{ steps.proposal-upload.outputs.artifact-digest }}
